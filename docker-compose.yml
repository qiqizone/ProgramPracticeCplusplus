services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /var/lib/cpp-practice/app.db
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中设置 JWT_SECRET}
    volumes:
      - cpp_data:/var/lib/cpp-practice
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  cpp_data:
